<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapAI - 智能截图工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .logo {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #a0aec0;
      font-size: 1.1rem;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .feature {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .feature-icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .feature h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .feature p { color: #a0aec0; font-size: 0.9rem; line-height: 1.5; }
    .download {
      text-align: center;
      margin-bottom: 2rem;
    }
    .download-btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
      border-radius: 50px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(66, 153, 225, 0.4);
    }
    .version { color: #718096; margin-top: 0.5rem; font-size: 0.9rem; }
    .footer {
      text-align: center;
      padding: 2rem;
      color: #718096;
      font-size: 0.9rem;
    }
    .footer a { color: #4299e1; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .features { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">📸</div>
      <h1>SnapAI</h1>
      <p class="subtitle">智能截图工具 - 支持 AI 识图与多语言翻译</p>
    </header>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🎯</div>
        <h3>快捷截图</h3>
        <p>Ctrl+Shift+A 一键截图，支持多显示器和选区拖拽</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🤖</div>
        <h3>AI 智能识图</h3>
        <p>截图表述、内容提取、代码识别，轻松搞定</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🌐</div>
        <h3>多语言翻译</h3>
        <p>OCR + 翻译一体化，支持中英日韩法德西等语言</p>
      </div>
      <div class="feature">
        <div class="feature-icon">🔒</div>
        <h3>安全隐私</h3>
        <p>API Key 加密存储，不收集数据，不发送遥测</p>
      </div>
    </div>
    
    <div class="download">
      <a href="https://github.com/stohox/snapai/releases/latest/download/SnapAI-portable.exe" class="download-btn" id="download-btn">
        下载 Windows 便携版
      </a>
      <p class="version" id="version">v1.0.0</p>
    </div>
  </div>
  
  <footer class="footer">
    <p>
      <a href="https://github.com/stohox/snapai">GitHub</a> · 
      MIT License · 
      Made with ❤️
    </p>
  </footer>

  <script>
    async function getLatestRelease() {
      try {
        const response = await fetch('https://api.github.com/repos/stohox/snapai/releases/latest');
        const data = await response.json();
        const exeAsset = data.assets?.find(a => a.name.endsWith('.exe'));
        if (exeAsset) {
          document.getElementById('download-btn').href = exeAsset.browser_download_url;
          document.getElementById('version').textContent = 'v' + data.tag_name.replace('v', '');
        }
      } catch (e) {
        console.log('Could not fetch latest release');
      }
    }
    getLatestRelease();
  </script>
</body>
</html>
